# ============================================================================
# Globales Glossar
# ============================================================================
#
# Eine Datei fuer alle Themenbereiche. Jeder Begriff, der hier steht, bekommt
# site-weit automatisch einen Tooltip - auf jeder Seite, ohne dass in der
# .qmd-Datei irgendetwas eingetragen werden muesste.
#
# Eingebunden ueber  metadata-files:  in _quarto.yml, ausgewertet von
# glossary.lua zur Build-Zeit.
#
# ----------------------------------------------------------------------------
# Felder je Eintrag
# ----------------------------------------------------------------------------
#   term     Der Begriff, exakt so geschrieben wie im Text. Pflicht.
#   def      Ein bis zwei Saetze. Erscheint im Tooltip - kein Markdown,
#            keine Zeilenumbrueche, keine Anfuehrungszeichen im Text.
#   topic    Themenbereich fuer die Gruppierung auf der Glossarseite.
#            Bisher vergeben: Statistik, Programmierung, ML, Visualisierung,
#            Daten. Neue Bereiche einfach verwenden.
#   aliases  Optional. Weitere Schreibweisen, die denselben Tooltip bekommen,
#            typischerweise Plural oder gebeugte Formen.
#   tags     Optional. Tags aus dem Vokabular in instruction.md. Nur bei
#            mehrdeutigen Begriffen noetig, siehe unten.
#
# ----------------------------------------------------------------------------
# Mehrdeutige Begriffe
# ----------------------------------------------------------------------------
# Manche Woerter bedeuten je nach Themenbereich etwas anderes. Statt topic und
# def direkt am Eintrag stehen dann mehrere bedeutungen, jede mit eigenem
# topic, eigener def und optionalen tags:
#
#   - term: Faktor
#     aliases: [Faktoren]
#     bedeutungen:
#       - topic: Programmierung
#         tags: [R, Programmiergrundlagen]
#         def: Datentyp in R fuer kategoriale Merkmale ...
#       - topic: Statistik
#         tags: [Faktorenanalyse, Dimensionsreduktion]
#         def: Nicht direkt beobachtete Groesse ...
#
# Welche Bedeutung im Tooltip landet, entscheiden die tags gegen die
# categories der Seite:
#
#   genau eine passt   -> nur diese wird gezeigt
#   keine passt        -> alle werden gezeigt, jede mit Themenlabel
#   mehrere passen     -> diese werden gezeigt, jede mit Themenlabel
#
# Bewusst wird nie ausgeblendet. Ein fehlender Tooltip faellt niemandem auf,
# ein etwas laengerer schon.
#
# ----------------------------------------------------------------------------
# Regeln, die der Filter anwendet
# ----------------------------------------------------------------------------
#   - Ganze Woerter, keine Treffer innerhalb anderer Woerter.
#     "Median" trifft nicht in "Medianwert" - dafuer braucht es ein alias.
#   - Gross-/Kleinschreibung egal, auch bei Umlauten.
#   - Jedes Vorkommen wird markiert, nicht nur das erste einer Seite.
#   - Nicht angetastet werden: Code, Ueberschriften, Links, Bildunterschriften.
#   - Mehrwortbegriffe sind erlaubt ("Zentraler Grenzwertsatz").
#
# Eine Seite kann sich ausnehmen mit  glossary-skip: true  im Front Matter.
#
# ----------------------------------------------------------------------------
# Hier stehen bewusst nur drei Beispieleintraege. Die eigentlichen Begriffe
# kommen lektionsweise dazu.
# ----------------------------------------------------------------------------

glossary:
  - term: Median
    topic: Statistik
    aliases: [Medians]
    def: Der Wert in der Mitte der sortierten Datenreihe. Er teilt die Beobachtungen in zwei gleich grosse Hälften und reagiert im Gegensatz zum Mittelwert kaum auf Ausreisser.

  - term: Broadcasting
    topic: Programmierung
    def: Regel in NumPy, nach der Arrays unterschiedlicher Form miteinander verrechnet werden. Achsen der Länge eins werden dabei virtuell wiederholt, statt die Daten tatsächlich zu vervielfältigen.

  - term: Zentraler Grenzwertsatz
    topic: Statistik
    aliases: [Grenzwertsatz]
    def: Summen und Mittelwerte vieler unabhängiger Zufallsgrössen nähern sich einer Normalverteilung an, unabhaengig davon, wie die einzelnen Groessen selbst verteilt sind.

  # --- aus L1 (ESDS): R-Grundlagen -----------------------------------------

  - term: Vektor
    topic: Programmierung
    aliases: [Vektoren, Vektors]
    def: Folge von Werten desselben Typs, die als Einheit behandelt wird. In R ist der Vektor die Grundstruktur; auch ein einzelner Wert ist ein Vektor der Länge eins.

  - term: Vektorisierung
    topic: Programmierung
    aliases: [vektorisiert, vektorisierte, vektorisierten]
    def: Eine Operation wirkt auf eine ganze Folge von Werten statt auf einzelne Elemente. Das ersetzt ausgeschriebene Schleifen und ist in der Regel deutlich schneller.

  - term: Recycling
    topic: Programmierung
    def: Regel in R, nach der beim Verrechnen zweier unterschiedlich langer Vektoren der kürzere wiederholt wird, bis er zum längeren passt. Bequem bei einem einzelnen Wert, eine häufige Fehlerquelle bei unbeabsichtigt ungleichen Längen.

  - term: Coercion
    topic: Programmierung
    aliases: [Typumwandlung]
    def: Stillschweigende Umwandlung in einen gemeinsamen Typ, wenn verschiedene Typen aufeinandertreffen. Aus Zahlen wird dabei Text, sobald ein Textwert beteiligt ist.

  # Beispiel fuer einen mehrdeutigen Begriff: In ESDS ist der Faktor ein
  # R-Datentyp, in STATDA eine latente Groesse der Faktorenanalyse.
  - term: Faktor
    aliases: [Faktoren]
    bedeutungen:
      - topic: Programmierung
        tags: [Programmiergrundlagen, tidyverse, Tooling]
        def: Datentyp in R für kategoriale Merkmale. Er speichert die Werte als Codes und führt die möglichen Ausprägungen als Stufen mit, auch solche, die in den Daten nicht vorkommen.
      - topic: Statistik
        tags: [Faktorenanalyse, Dimensionsreduktion]
        def: Nicht direkt beobachtete Grösse, die hinter mehreren gemessenen Merkmalen steht und deren gemeinsame Variation erklärt.

  - term: Data Frame
    topic: Programmierung
    aliases: [DataFrame, Data Frames]
    def: Tabellenartige Datenstruktur aus gleich langen Spalten, die je einen eigenen Typ tragen dürfen. Zeilen sind Beobachtungen, Spalten sind Merkmale.

  - term: Matrix
    topic: Programmierung
    def: Rechteckige Anordnung von Werten desselben Typs in Zeilen und Spalten. Anders als ein Data Frame kann sie keine gemischten Typen aufnehmen.

  - term: Chunk
    topic: Programmierung
    aliases: [Chunks, Codechunk]
    def: Abschnitt ausführbaren Codes in einem Quarto- oder R-Markdown-Dokument. Beim Rendern wird er ausgeführt; Ausgabe und Grafiken erscheinen an seiner Stelle.

  - term: Quarto
    topic: Programmierung
    def: Publikationssystem, das Text, Code und dessen Ausgabe in einem Dokument vereint und daraus HTML, PDF oder Folien erzeugt. Nachfolger von R Markdown, sprachunabhängig.

  - term: Arbeitsverzeichnis
    topic: Programmierung
    def: Ordner, auf den sich relative Pfade in einer Sitzung beziehen. Steht er durch ein Projekt fest, laufen Skripte unabhängig vom einzelnen Rechner.

  - term: Reproduzierbarkeit
    topic: Programmierung
    aliases: [reproduzierbar, reproduzierbare]
    def: Eigenschaft einer Auswertung, aus denselben Daten und demselben Code jederzeit dasselbe Ergebnis zu liefern, auch auf einem anderen Rechner.

  # --- aus L2 (ESDS): Datenaufbereitung -------------------------------------

  - term: Tidy data
    topic: Programmierung
    aliases: [aufgeräumt, aufgeräumte]
    def: Form einer Tabelle, in der jede Zeile eine Beobachtung, jede Spalte ein Merkmal und jede Tabelle eine Beobachtungseinheit beschreibt. Werkzeuge zur Datenanalyse setzen diese Form voraus.

  - term: Pipe
    aliases: [Pipes]
    bedeutungen:
      - topic: Programmierung
        tags: [tidyverse, pandas]
        def: Operator, der das Ergebnis links als erstes Argument an die Funktion rechts weitergibt, in R geschrieben als |>. Er lässt eine Verarbeitungskette in der Reihenfolge lesen, in der sie gedacht wird.
      - topic: Werkzeuge
        tags: [Linux]
        def: Verbindung zweier Programme in der Shell, bei der die Ausgabe des einen zur Eingabe des nächsten wird. Damit entstehen aus kleinen Werkzeugen ganze Verarbeitungsketten.

  - term: split-apply-combine
    topic: Programmierung
    def: Muster der Gruppenauswertung. Daten werden nach einem Schlüssel aufgeteilt, je Gruppe wird dieselbe Funktion angewendet, die Ergebnisse werden wieder zu einer Tabelle zusammengesetzt.

  # --- aus L3 (ESDS): Skalen und Häufigkeiten --------------------------------

  - term: Skalenniveau
    topic: Statistik
    aliases: [Skalenniveaus, Messniveau]
    def: Einteilung eines Merkmals danach, welche Vergleiche zulässig sind. Nominal erlaubt nur Gleichheit, ordinal zusätzlich eine Rangfolge, intervall zusätzlich Differenzen, verhältnis zusätzlich Verhältnisse.

  - term: Modus
    topic: Statistik
    def: Die häufigste Ausprägung eines Merkmals. Einziges Lagemass, das auch bei nominalen Daten definiert ist, und nicht notwendigerweise eindeutig.

  - term: Histogramm
    topic: Statistik
    aliases: [Histogramme, Histogramms]
    def: Darstellung der Verteilung eines metrischen Merkmals über aneinandergrenzende Klassen. Bei ungleichen Klassenbreiten trägt die Fläche die Information, nicht die Höhe.

  - term: Empirische Verteilungsfunktion
    topic: Statistik
    aliases: [ECDF]
    def: Treppenfunktion, die zu jedem Wert den Anteil der Beobachtungen angibt, die höchstens so gross sind. Sie kommt ohne Klassenbildung aus und erlaubt das Ablesen beliebiger Quantile.

  # --- aus L5 bis L7 (ESDS) --------------------------------------------------

  - term: Aesthetic
    topic: Programmierung
    aliases: [Aesthetics, aes]
    def: Zuordnung einer Variablen zu einer visuellen Eigenschaft wie Position, Farbe, Form oder Grösse. Nur was zugeordnet ist, bekommt eine Skala und eine Legende; ein fest gesetzter Wert nicht.

  - term: Geom
    topic: Programmierung
    aliases: [Geome, Geoms]
    def: Baustein einer Grafik, der bestimmt, mit welchen geometrischen Objekten gezeichnet wird, etwa Punkten, Linien oder Balken. Mehrere Geome können dieselben Daten übereinanderlegen.

  - term: Facette
    topic: Programmierung
    aliases: [Facetten, Facettierung]
    def: Aufteilung einer Grafik in Teilbilder nach einer kategorialen Variablen. Die gemeinsamen Achsen machen die Teilbilder untereinander vergleichbar.

  - term: Kovariation
    topic: Statistik
    def: Gemeinsames Verhalten zweier Merkmale. Welche Darstellung dafür taugt, hängt von der Kombination der Skalenniveaus ab.

  - term: Plausibilitätsprüfung
    topic: Statistik
    aliases: [Plausibilitätsprüfungen, Plausibilität]
    def: Kontrolle, ob Werte überhaupt möglich sind, etwa negative Mengen, Datumsangaben in der Zukunft oder gehäufte Rundwerte. Auffälligkeiten verweisen meist auf die Erhebung, nicht auf den Gegenstand.

  - term: Kombinatorik
    topic: Statistik
    def: Lehre vom Abzählen der Möglichkeiten. Sie liefert die Anzahl günstiger und möglicher Fälle und damit den Nenner der Laplace-Wahrscheinlichkeit.

  - term: Binomialkoeffizient
    topic: Statistik
    def: Anzahl der Möglichkeiten, k Elemente aus n auszuwählen, wenn die Reihenfolge keine Rolle spielt. Gesprochen n über k.

  - term: Laplace-Wahrscheinlichkeit
    topic: Statistik
    def: Quotient aus der Zahl günstiger und der Zahl möglicher Fälle. Setzt voraus, dass alle Elementarereignisse gleich wahrscheinlich sind.

  - term: Gegenereignis
    topic: Statistik
    def: Das Ereignis, dass etwas nicht eintritt. Aufgaben nach dem Muster mindestens einmal lassen sich darüber meist mit einer einzigen Rechnung lösen.

  - term: Spielerfehlschluss
    topic: Statistik
    def: Die irrige Annahme, ein Zufallsvorgang gleiche frühere Abweichungen aktiv aus. Der Anteil nähert sich dem Erwartungswert, weil die Gesamtzahl wächst, nicht durch Gegenbewegung.

  # --- aus L8 bis L10 (ESDS) -------------------------------------------------

  - term: Bedingte Wahrscheinlichkeit
    topic: Statistik
    def: Wahrscheinlichkeit eines Ereignisses unter der Voraussetzung, dass ein anderes eingetreten ist. Die Bedingung verkleinert den betrachteten Grundraum auf die Fälle, in denen sie zutrifft.

  - term: Stochastische Unabhängigkeit
    topic: Statistik
    aliases: [Unabhängigkeit, unabhängig]
    def: Zwei Ereignisse sind unabhängig, wenn das Wissen über das eine die Wahrscheinlichkeit des anderen nicht verändert. Nicht zu verwechseln mit disjunkt, was die stärkste Form der Abhängigkeit wäre.

  - term: Satz von Bayes
    topic: Statistik
    aliases: [Bayes]
    def: Regel, mit der sich eine bedingte Wahrscheinlichkeit umkehren lässt. Aus der Wahrscheinlichkeit eines Testergebnisses bei bekannter Ursache wird die Wahrscheinlichkeit der Ursache bei bekanntem Ergebnis.

  - term: Sensitivität
    topic: Statistik
    def: Anteil der positiven Testergebnisse unter den tatsächlich Betroffenen. Eigenschaft des Tests, unabhängig davon, wie verbreitet der gesuchte Zustand ist.

  - term: Spezifität
    topic: Statistik
    def: Anteil der negativen Testergebnisse unter den tatsächlich nicht Betroffenen. Bei seltenen Zuständen bestimmt sie die Zahl der falsch positiven Fälle und damit die Aussagekraft eines positiven Ergebnisses.

  - term: Prävalenz
    topic: Statistik
    def: Anteil der Betroffenen in der untersuchten Gruppe. Sie entscheidet mit darüber, wie aussagekräftig ein positives Testergebnis ist, und ist keine Eigenschaft des Tests.

  - term: Positiver Vorhersagewert
    topic: Statistik
    aliases: [Vorhersagewert, PPV]
    def: Anteil der tatsächlich Betroffenen unter allen positiv Getesteten. Hängt neben der Testgüte von der Prävalenz ab und wird deshalb häufig mit der Sensitivität verwechselt.

  - term: Zufallsvariable
    topic: Statistik
    aliases: [Zufallsvariablen]
    def: Abbildung, die jedem Ergebnis eines Zufallsvorgangs eine Zahl zuordnet. Erst dadurch lassen sich Erwartungswert und Varianz bilden.

  - term: Erwartungswert
    topic: Statistik
    aliases: [Erwartungswerts, Erwartungswertes]
    def: Mit Wahrscheinlichkeiten gewichtetes Mittel der möglichen Werte einer Zufallsvariablen. Eigenschaft des Modells, nicht der Daten, und selbst kein notwendigerweise möglicher Wert.

  - term: Binomialverteilung
    topic: Statistik
    def: Verteilung der Anzahl Erfolge bei einer festen Zahl unabhängiger Versuche mit gleichbleibender Erfolgswahrscheinlichkeit. Genau diese drei Voraussetzungen brechen in der Praxis am ehesten.

  - term: Poissonverteilung
    topic: Statistik
    def: Verteilung der Anzahl Ereignisse in einem festen Intervall bei konstanter Rate. Erwartungswert und Varianz sind gleich, was als Prüfstein für die Modellwahl dient.

  - term: Überdispersion
    topic: Statistik
    def: Fall, in dem die beobachtete Streuung deutlich über der vom Modell erwarteten liegt. Bei Zähldaten ein Hinweis darauf, dass Ereignisse in Schüben auftreten statt unabhängig.

  - term: Dichtefunktion
    topic: Statistik
    aliases: [Dichte]
    def: Beschreibt eine stetige Verteilung. Ihre Werte sind keine Wahrscheinlichkeiten, sondern Wahrscheinlichkeit pro Einheit; die Wahrscheinlichkeit ist die Fläche unter der Kurve und kann deshalb Werte über eins annehmen.

  - term: Normalverteilung
    topic: Statistik
    aliases: [normalverteilt, normalverteilte]
    def: Symmetrische, glockenförmige Verteilung, die durch Mittelwert und Standardabweichung festgelegt ist. Ihre Bedeutung stammt vom zentralen Grenzwertsatz, nicht davon, dass viele Merkmale so verteilt wären.

  - term: z-Wert
    topic: Statistik
    aliases: [z-Werte, Standardisierung, standardisiert]
    def: Abweichung eines Wertes vom Mittel, gemessen in Standardabweichungen. Macht Merkmale mit verschiedenen Einheiten und Grössenordnungen vergleichbar.

  - term: QQ-Plot
    topic: Statistik
    aliases: [QQ-Plots]
    def: Darstellung der beobachteten gegen die theoretisch erwarteten Quantile. Liegen die Punkte auf einer Geraden, passt die Verteilungsannahme; Krümmung zeigt Schiefe, Abknicken an den Enden schwerere Ränder.

  - term: Gedächtnislosigkeit
    topic: Statistik
    aliases: [gedächtnislos]
    def: Eigenschaft der Exponentialverteilung, bei der die verbleibende Wartezeit nicht davon abhängt, wie lange bereits gewartet wurde. Für Verschleissprozesse ist das meist die falsche Annahme.

  # --- aus L11 bis L14 (ESDS) ------------------------------------------------

  - term: Kovarianz
    topic: Statistik
    def: Mass für die gemeinsame Abweichung zweier Merkmale von ihrem jeweiligen Mittel. Hängt an den Einheiten und wird deshalb meist zur Korrelation normiert.

  - term: Rangkorrelation
    topic: Statistik
    aliases: [Spearman]
    def: Zusammenhangsmass, das auf den Rängen statt den Werten rechnet. Passt für ordinale Merkmale und für monotone, aber nicht lineare Zusammenhänge.

  - term: Bestimmtheitsmass
    topic: Statistik
    aliases: [R-Quadrat]
    def: Anteil der Streuung der Zielgrösse, den ein Modell erklärt. Sagt etwas über die Enge des Zusammenhangs, aber nichts darüber, ob die Modellform angemessen ist.

  - term: Residuum
    topic: Statistik
    aliases: [Residuen, Residuenanalyse]
    def: Abstand zwischen beobachtetem und vom Modell vorhergesagtem Wert. Ein Muster in den Residuen zeigt an, dass das Modell etwas Systematisches übersieht.

  - term: Kleinste Quadrate
    topic: Statistik
    aliases: [Kleinste-Quadrate-Schätzung]
    def: Schätzverfahren, das die Summe der quadrierten Abweichungen minimiert. Durch das Quadrieren heben sich Abweichungen nicht auf und grosse fallen stärker ins Gewicht.

  - term: Scheinkorrelation
    topic: Statistik
    def: Zusammenhang zwischen zwei Merkmalen, der allein durch eine dritte, nicht betrachtete Grösse entsteht. Verschwindet, sobald diese festgehalten wird.

  - term: Stichprobenverteilung
    topic: Statistik
    def: Verteilung einer Kennzahl über gedachte Wiederholungen der Stichprobenziehung. Ihre Streuung ist der Standardfehler.

  - term: Standardfehler
    topic: Statistik
    def: Streuung einer geschätzten Kennzahl von Stichprobe zu Stichprobe. Sinkt mit der Wurzel des Stichprobenumfangs, weshalb vierfacher Aufwand die Genauigkeit nur verdoppelt.

  - term: Konfidenzintervall
    topic: Statistik
    aliases: [Konfidenzintervalle, Konfidenzintervalls]
    def: Spanne, die bei wiederholter Anwendung des Verfahrens in einem festgelegten Anteil der Fälle den wahren Parameter überdeckt. Die Aussage gilt dem Verfahren, nicht dem einzelnen berechneten Intervall.

  - term: Nullhypothese
    topic: Statistik
    def: Annahme, die ein Test zu widerlegen versucht, meist kein Unterschied oder kein Effekt. Sie kann verworfen oder nicht verworfen, aber nie bestätigt werden.

  - term: p-Wert
    topic: Statistik
    aliases: [p-Werte, p-Werts]
    def: Wahrscheinlichkeit, unter der Nullhypothese ein mindestens so extremes Ergebnis zu erhalten. Nicht die Wahrscheinlichkeit, dass die Nullhypothese zutrifft, und kein Mass für die Grösse eines Effekts.

  - term: Signifikanzniveau
    topic: Statistik
    aliases: [signifikant, Signifikanz]
    def: Vorab festgelegte Schranke für den Fehler erster Art, üblicherweise fünf Prozent. Sie begrenzt, wie oft ein Test eine zutreffende Nullhypothese verwirft.

  - term: Fehler erster Art
    topic: Statistik
    aliases: [Alphafehler]
    def: Eine zutreffende Nullhypothese wird verworfen, es wird also ein Effekt behauptet, den es nicht gibt. Seine Wahrscheinlichkeit ist das Signifikanzniveau.

  - term: Fehler zweiter Art
    topic: Statistik
    aliases: [Betafehler]
    def: Ein tatsächlich vorhandener Effekt wird übersehen. Seine Wahrscheinlichkeit hängt von Stichprobenumfang und Effektgrösse ab und wird selten berichtet.

  - term: Teststärke
    topic: Statistik
    aliases: [Power]
    def: Wahrscheinlichkeit, einen vorhandenen Effekt auch zu finden. Sie wächst mit Stichprobenumfang und Effektgrösse und ist das Gegenstück zum Fehler zweiter Art.

  - term: Effektgrösse
    topic: Statistik
    def: Mass für die Stärke eines Effekts, unabhängig vom Stichprobenumfang. Gehört zu jedem Testergebnis, weil bei grossen Stichproben auch bedeutungslose Unterschiede signifikant werden.

  - term: t-Test
    topic: Statistik
    aliases: [t-Tests]
    def: Test auf Unterschiede von Mittelwerten, in den Varianten gegen einen Sollwert, zwischen zwei Gruppen und für verbundene Messungen. Die gepaarte Variante ist bei paarweise erhobenen Daten deutlich trennschärfer.

  - term: Chi-Quadrat-Test
    topic: Statistik
    aliases: [Chi-Quadrat-Tests]
    def: Test für Häufigkeiten kategorialer Merkmale. Vergleicht beobachtete mit den unter der Nullhypothese erwarteten Häufigkeiten und setzt hinreichend grosse erwartete Werte voraus.

  - term: Freiheitsgrade
    topic: Statistik
    def: Anzahl der Grössen, die bei gegebenen Randbedingungen noch frei variieren können. Sie bestimmen die Form der Prüfverteilung und damit den p-Wert.

