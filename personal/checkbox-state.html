<script>
(function() {
  try {
    // Checkboxen: Zustand in localStorage speichern
    var key = "cb-" + location.pathname;
    var boxes = document.querySelectorAll('input[type="checkbox"]');
    var saved = JSON.parse(localStorage.getItem(key) || "{}");
    boxes.forEach(function(cb, i) {
      if (saved[i]) cb.checked = true;
      cb.addEventListener("change", function() {
        var state = {};
        boxes.forEach(function(b, j) { if (b.checked) state[j] = true; });
        localStorage.setItem(key, JSON.stringify(state));
      });
    });
    // Links zu Lernabschnitten in neuem Tab oeffnen
    var content = document.querySelector("#quarto-document-content") || document.body;
    content.querySelectorAll("a[href]").forEach(function(a) {
      var href = a.getAttribute("href");
      if (href && !href.startsWith("#") && !href.startsWith("javascript")) {
        a.setAttribute("target", "_blank");
        a.setAttribute("rel", "noopener");
      }
    });
  } catch(e) {}
})();
</script>
