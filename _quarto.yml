project:
  type: website
  output-dir: docs
  resources:
    - robots.txt
  # Nur die aktiven Module rendern. Die uebrigen .qmd-Dateien bleiben im Repo
  # liegen; sobald ein Modul startet, hier wieder eintragen und den passenden
  # Abschnitt in website.sidebar.contents einkommentieren.
  render:
    - index.qmd
    - stand.qmd
    - tags.qmd
    - glossar.qmd
    - links.qmd
    - programmierung/
    - daten/
    - datenbanken/
    - werkzeuge/
    - statistik/
    - ki/
    - visualisierung/
    - referenz/

# Das Glossar liegt in einer eigenen Datei und wird hier in die
# Projektmetadaten gemischt. Dadurch steht es jeder Seite als meta.glossary
# zur Verfuegung, wo glossary.lua es ausliest.
metadata-files:
  - glossary.yml

# Deutsche Beschriftungen, damit Querverweise als "Abbildung 3" erscheinen
# statt als "Figure 3" und die Oberflaeche zur Sprache der Seiten passt.
lang: de

website:
  title: "Data Science Notizen"
  description: "Persönliche Lern- und Nachschlagenotizen, nicht für Suchmaschinen bestimmt"
  site-url: https://dimivo-7.github.io/Data-Science/
  repo-url: https://github.com/Dimivo-7/Data-Science
  page-footer:
    center: "Persönliche Notizen, nicht öffentlich beworben"
  search: true
  navbar:
    title: "Data Science"
    right:
      - icon: github
        href: https://github.com/Dimivo-7/Data-Science
        aria-label: "Repository auf GitHub"
    tools-collapse: false
  sidebar:
    style: docked
    collapse-level: 1
    # Jeder Eintrag ist genau eine Seite. Abschnitte tragen deshalb ein eigenes
    # href - ohne das erzeugt Quarto einen reinen Text-Aufklapper und darunter
    # nochmal den Link auf dieselbe Seite (Dopplung).
    contents:
      - text: "Übersicht"
        href: index.qmd
      - text: "Stand der Seite"
        href: stand.qmd
      # Kein Untermenue noetig - einzelne Seite.
      - text: "Tags"
        href: tags.qmd
      - text: "Glossar"
        href: glossar.qmd
      - text: "Linkliste"
        href: links.qmd
      # Neue thematische Struktur. Sie wird neben der alten aufgebaut; die
      # Kursordner darunter verschwinden, sobald ihre Inhalte migriert sind.
      - section: "Programmierung"
        href: programmierung/index.qmd
        contents:
          - auto: "programmierung/*.qmd"
      - section: "Daten"
        href: daten/index.qmd
        contents:
          - auto: "daten/*.qmd"
      - section: "Datenbanken"
        href: datenbanken/index.qmd
        contents:
          - auto: "datenbanken/*.qmd"
      - section: "Werkzeuge"
        href: werkzeuge/index.qmd
        contents:
          - auto: "werkzeuge/*.qmd"
      - section: "Statistik"
        href: statistik/index.qmd
        contents:
          - text: "Übergreifende Fragen"
            href: statistik/fragen.qmd
          - section: "Grundlagen"
            href: statistik/grundlagen/index.qmd
            contents:
              - auto: "statistik/grundlagen/*.qmd"
          - section: "Wahrscheinlichkeit"
            href: statistik/wahrscheinlichkeit/index.qmd
            contents:
              - auto: "statistik/wahrscheinlichkeit/*.qmd"
          - section: "Inferenz"
            href: statistik/inferenz/index.qmd
            contents:
              - auto: "statistik/inferenz/*.qmd"
          - section: "Tests"
            href: statistik/tests/index.qmd
            contents:
              - auto: "statistik/tests/*.qmd"
          - section: "Regression"
            href: statistik/regression/index.qmd
            contents:
              - auto: "statistik/regression/*.qmd"
          - section: "Überlebenszeit"
            href: statistik/ueberlebenszeit/index.qmd
            contents:
              - auto: "statistik/ueberlebenszeit/*.qmd"
          - section: "Multivariat"
            href: statistik/multivariat/index.qmd
            contents:
              - auto: "statistik/multivariat/*.qmd"
          - section: "Zeitreihen"
            href: statistik/zeitreihen/index.qmd
            contents:
              - auto: "statistik/zeitreihen/*.qmd"
      - section: "KI"
        href: ki/index.qmd
        contents:
          - auto: "ki/*.qmd"
      - section: "Visualisierung"
        href: visualisierung/index.qmd
        contents:
          - auto: "visualisierung/*.qmd"
      - section: "Referenz"
        href: referenz/index.qmd
        contents:
          - text: "R"
            href: referenz/r.qmd
          - text: "Python"
            href: referenz/python.qmd

# Ausfuehrbare Chunks. Die Rechenumgebung stellt die GitHub Action bereit
# (siehe .github/workflows/publish.yml) - lokal laeuft das nicht.
execute:
  echo: true          # Code bleibt sichtbar, er ist Teil der Notiz
  warning: false      # Paketmeldungen gehoeren nicht in den Text
  message: false
  # Quarto legt die Chunk-Ergebnisse in _freeze/ ab und rechnet eine Seite nur
  # neu, wenn sich ihr Quelltext geaendert hat. _freeze/ gehoert deshalb ins
  # Repo; die Action schreibt es nach jedem Rendern zurueck. Soll eine Seite
  # erzwungenermassen neu rechnen (etwa nach einem Paket-Update), wird ihr
  # Ordner unter _freeze/ geloescht.
  freeze: auto

# Abbildungen sollen die Content-Spalte ausfuellen. Ohne out.width gibt knitr
# den Bildern eine feste Pixelbreite (fig-width x fig-dpi = 672 px) mit; die
# Bootstrap-Klasse img-fluid deckelt die nur nach oben und fuellt nicht aus.
knitr:
  opts_chunk:
    out.width: "100%"

format:
  html:
    # Geometrie in Zoll bleibt - sie bestimmt Schriftgroesse und
    # Element-Proportionen im Plot. Erhoeht wird nur die Aufloesung, damit die
    # Rastergrafik auf der vollen Spaltenbreite scharf bleibt.
    #
    # Achtung beim Rechnen: Quarto verdoppelt den Wert zusaetzlich ueber
    # fig.retina: 2. Aus 144 werden also effektiv 288 dpi und damit
    # 7 x 288 = 2016 px Bildbreite - rund das Doppelte der Spaltenbreite und
    # damit auch auf HiDPI-Displays scharf. 192 ergaeben 2688 px; das ist
    # sichtbar nichts besser und nur groessere Dateien.
    fig-width: 7
    fig-height: 4.2
    fig-dpi: 144
    fig-align: center
    # Eingebaute Quarto-Funktion (ab 1.4): jedes Bild laesst sich per Klick
    # vergroessert anzeigen. Einzelne Bilder ausnehmen mit lightbox: false.
    lightbox: auto
    theme:
      light: [cosmo, styles.scss]
      dark: [darkly, styles.scss]
    filters:
      - lastupdate.lua
      - stand.lua
      - glossary.lua
      - quiz.lua
    toc: true
    toc-depth: 3
    toc-title: "Auf dieser Seite"
    anchor-sections: true
    link-external-newwindow: true
    link-external-filter: '^(?!https?:)|^https?:\/\/(?:[^\/]*\.)?github\.(?:io|com)(?:\/|$)'
    code-copy: true
    code-overflow: wrap
    include-in-header:
      text: |
        <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
