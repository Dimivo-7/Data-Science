project:
  type: website
  output-dir: docs
  resources:
    - robots.txt
  # Nur die aktiven Module rendern. Die uebrigen .qmd-Dateien bleiben im Repo
  # liegen; sobald ein Modul startet, hier wieder eintragen und den passenden
  # Abschnitt in website.sidebar.contents einkommentieren.
  render:
    - index.qmd
    - tags.qmd
    - cas-grundlagen/
    - cas-statda-davi/

website:
  title: "MAS Data Science – Meine Notizen"
  description: "Private Lern- und Nachschlagenotizen, nicht für Suchmaschinen bestimmt"
  site-url: https://dimivo-7.github.io/Data-Science/
  repo-url: https://github.com/Dimivo-7/Data-Science
  page-footer:
    center: "Private Notizen zum MAS Data Science (FFHS) – nicht öffentlich beworben"
  search: true
  navbar:
    title: "MAS Data Science"
    right:
      - icon: github
        href: https://github.com/Dimivo-7/Data-Science
        aria-label: "Repository auf GitHub"
    tools-collapse: false
  sidebar:
    style: docked
    collapse-level: 1
    # Jeder Eintrag ist genau eine Seite. Abschnitte tragen deshalb ein eigenes
    # href - ohne das erzeugt Quarto einen reinen Text-Aufklapper und darunter
    # nochmal den Link auf dieselbe Seite (Dopplung).
    contents:
      - text: "Startseite"
        href: index.qmd
      # Kein Untermenue noetig - einzelne Seite.
      - text: "Tags"
        href: tags.qmd
      - section: "CAS Grundlagen Data Science"
        href: cas-grundlagen/index.qmd
        contents:
          - section: "PYFR"
            href: cas-grundlagen/pyfr/index.qmd
            contents:
              - cas-grundlagen/pyfr/lesson1.qmd
              - cas-grundlagen/pyfr/lesson2.qmd
              - cas-grundlagen/pyfr/lesson3.qmd
              - cas-grundlagen/pyfr/lesson4.qmd
              - cas-grundlagen/pyfr/lesson5.qmd
              - cas-grundlagen/pyfr/lesson6.qmd
              - cas-grundlagen/pyfr/lesson7.qmd
              - cas-grundlagen/pyfr/lesson8.qmd
              - cas-grundlagen/pyfr/lesson9.qmd
              - cas-grundlagen/pyfr/lesson10.qmd
              - cas-grundlagen/pyfr/lesson11.qmd
              - cas-grundlagen/pyfr/lesson12.qmd
          - section: "ESDS"
            href: cas-grundlagen/esds/index.qmd
            contents:
              - cas-grundlagen/esds/lesson1.qmd
              - cas-grundlagen/esds/lesson2.qmd
              - cas-grundlagen/esds/lesson3.qmd
              - cas-grundlagen/esds/lesson4.qmd
              - cas-grundlagen/esds/lesson5.qmd
              - cas-grundlagen/esds/lesson6.qmd
              - cas-grundlagen/esds/lesson7.qmd
              - cas-grundlagen/esds/lesson8.qmd
              - cas-grundlagen/esds/lesson9.qmd
              - cas-grundlagen/esds/lesson10.qmd
              - cas-grundlagen/esds/lesson11.qmd
              - cas-grundlagen/esds/lesson12.qmd
              - cas-grundlagen/esds/lesson13.qmd
              - cas-grundlagen/esds/lesson14.qmd
      - section: "CAS Statistische Datenanalyse & Datenvisualisierung"
        href: cas-statda-davi/index.qmd
        contents:
          - section: "STATDA"
            href: cas-statda-davi/statda/index.qmd
