project:
  type: website
  output-dir: docs
  resources:
    - robots.txt

website:
  title: "MAS Data Science – Meine Notizen"
  description: "Private Lern- und Nachschlagenotizen, nicht für Suchmaschinen bestimmt"
  page-footer:
    center: "Private Notizen zum MAS Data Science (FFHS) – nicht öffentlich beworben"
  search: true
  sidebar:
    style: docked
    collapse-level: 1
    contents:
      - index.qmd
      - section: "CAS Grundlagen Data Science"
        contents:
          - cas-grundlagen/index.qmd
      - section: "CAS Statistische Datenanalyse & Datenvisualisierung"
        contents:
          - cas-statda-davi/index.qmd
          - section: "STATDA"
            contents:
              - cas-statda-davi/statda/index.qmd
              - cas-statda-davi/statda/lesson1.qmd
              - cas-statda-davi/statda/lesson2.qmd
              - cas-statda-davi/statda/lesson3.qmd
              - cas-statda-davi/statda/lesson4.qmd
              - cas-statda-davi/statda/lesson5.qmd
          - section: "DAVI"
            contents:
              - cas-statda-davi/davi/index.qmd
              - cas-statda-davi/davi/lesson1.qmd
              - cas-statda-davi/davi/lesson2.qmd
              - cas-statda-davi/davi/lesson3.qmd
              - cas-statda-davi/davi/lesson4.qmd
              - cas-statda-davi/davi/lesson5.qmd
      - section: "CAS Machine Learning"
        contents:
          - cas-ml/index.qmd
      - section: "CAS Data Engineering und Analytics"
        contents:
          - cas-dea/index.qmd
      - section: "CAS AI Engineering"
        contents:
          - cas-ai-eng/index.qmd
      - section: "CAS Advanced Machine Learning"
        contents:
          - cas-adv-ml/index.qmd
      - section: "Masterthesis"
        contents:
          - masterthesis/index.qmd

format:
  html:
    theme:
      light: [cosmo, styles.scss]
      dark: [darkly, styles.scss]
    css: styles.css
    filters:
      - lastupdate.lua
    toc: true
    toc-depth: 3
    toc-title: "Auf dieser Seite"
    anchor-sections: true
    link-external-newwindow: true
    code-copy: true
    code-overflow: wrap
    include-in-header:
      text: |
        <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">

comments:
  giscus:
    repo: "DEIN-USERNAME/DEIN-REPO"
    repo-id: "HIER-EINTRAGEN-siehe-giscus.app"
    category: "Comments"
    category-id: "HIER-EINTRAGEN-siehe-giscus.app"
    mapping: pathname
    reactions-enabled: true
    input-position: "top"
    theme: preferred_color_scheme
