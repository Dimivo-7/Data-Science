on:
  push:
    branches: [main]
  workflow_dispatch: {}

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Ab hier werden die Rechenumgebungen bereitgestellt. Die Themenseiten
      # enthalten ausfuehrbare Chunks; Grafiken und Ausgaben entstehen beim
      # Build. Ohne diese Schritte bricht das Rendern ab.
      #
      # Quarto nutzt fuer .qmd mit R-Chunks die knitr-Engine. Die Python-Chunks
      # laufen ueber reticulate im selben Dokument - deshalb muss RETICULATE_PYTHON
      # auf genau den Interpreter zeigen, den setup-python installiert hat.

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          # Binaerpakete von Posit Package Manager statt Quellcode:
          # verkuerzt die Installation von Minuten auf Sekunden.
          use-public-rspm: true

      - name: Install R packages
        shell: Rscript {0}
        run: |
          install.packages(c(
            "knitr", "rmarkdown", "reticulate",
            "ggplot2", "dplyr", "tidyr", "readr", "lubridate",
            "DBI", "RSQLite",
            "car", "lmtest", "effectsize", "pwr"
          ))

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas matplotlib scipy seaborn statsmodels pingouin

      - name: Point reticulate at this Python
        run: echo "RETICULATE_PYTHON=$(which python)" >> "$GITHUB_ENV"

      # Voruebergehend: rendert einmal und schreibt die Ausgabe bei einem Fehler
      # als render.log ins Repo, weil die Action-Logs ohne Token nicht lesbar
      # sind. Wird nach der Diagnose entfernt.
      - name: Diagnose-Render
        id: diagnose
        continue-on-error: true
        run: |
          set -o pipefail
          quarto render 2>&1 | tee render.log

      - name: Render-Log zurueckschreiben
        if: steps.diagnose.outcome == 'failure'
        run: |
          tail -c 60000 render.log > render-tail.log
          mv render-tail.log render.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f render.log
          git commit -m "Render-Log fuer die Fehlersuche [skip ci]"
          git push origin HEAD:main
          exit 1

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: Europe/Zurich

      # Gerechnet wird nur in der Action, also entstehen die Freeze-Dateien auch
      # nur dort. Ohne diesen Schritt faende der naechste Lauf nichts vor und
      # wuerde alles neu rechnen. [skip ci] verhindert, dass dieser Commit
      # seinerseits einen Build ausloest.
      - name: Freeze-Ergebnisse zurueckschreiben
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f _freeze
          if git diff --cached --quiet; then
            echo "Keine neuen Freeze-Ergebnisse."
          else
            git commit -m "Freeze-Ergebnisse aktualisieren [skip ci]"
            git push origin HEAD:main
          fi
